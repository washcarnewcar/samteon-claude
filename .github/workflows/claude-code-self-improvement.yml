name: Claude Code self-improvement plugin

# The background distillation worker spawns detached processes, holds SQLite
# leases, and pipes a prompt over stdin — the exact area where the sibling
# Codex plugin needed three follow-up commits to get Windows right. Run the
# suite on all three OSes so those bugs surface here rather than on a user's
# machine.

on:
  pull_request:
    paths:
      - "plugins/claude-code-self-improving-skills/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/claude-code-self-improvement.yml"
  push:
    branches: [main]
    paths:
      - "plugins/claude-code-self-improving-skills/**"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/claude-code-self-improvement.yml"

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install pytest pytest-timeout
      - name: Test plugin
        run: python -m pytest -vv --timeout=60 plugins/claude-code-self-improving-skills/tests
      - run: python -m compileall -q plugins/claude-code-self-improving-skills/scripts

      # The tests invoke the Python scripts directly, which would pass even if
      # the shell hooks Claude Code actually runs were broken. Windows is where
      # that gap bites: there is no `python3` on a standard install, so a hook
      # that hardcodes it becomes a silent no-op nobody notices.
      - name: Run the real hook commands
        shell: bash
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}/plugins/claude-code-self-improving-skills
          # These hooks stand down in Cowork, so pin the runtime they are being
          # tested in. A runner's HOME already detects as local, but pinning
          # keeps the step meaningful if detection ever changes — otherwise it
          # could go green while every hook returned early.
          SIS_RUNTIME: local
        run: |
          set -euo pipefail
          out=$(echo '{}' | bash "$CLAUDE_PLUGIN_ROOT/hooks/distill-nudge.sh")
          echo "Stop hook -> $out"
          echo "$out" | python -c 'import json,sys; assert json.load(sys.stdin)["decision"] in ("approve","block")'

          payload='{"tool_input":{"file_path":"/nonexistent/.claude/skills/x/SKILL.md"}}'
          echo "$payload" | bash "$CLAUDE_PLUGIN_ROOT/hooks/backup-skill.sh"
          echo "$payload" | bash "$CLAUDE_PLUGIN_ROOT/hooks/validate-skill.sh"
          echo '{"source":"startup"}' | bash "$CLAUDE_PLUGIN_ROOT/hooks/session-init.sh" >/dev/null

          # An interpreter must actually have been found; an empty SIS_PYTHON
          # means every hook above exited early and proved nothing.
          . "$CLAUDE_PLUGIN_ROOT/hooks/python3.sh"
          test -n "$SIS_PYTHON"
          echo "interpreter: $SIS_PYTHON"

      # runtime_env.py is deliberately duplicated into the cowork plugin (each
      # plugin installs as a self-contained directory), and it is the one module
      # where divergence is silent and total: if a detection fix lands in only
      # one copy the two variants disagree on what "Cowork" means, and the gate
      # that exists to keep exactly one of them acting lets both run or neither.
      - name: Check the duplicated runtime detector has not drifted
        shell: bash
        run: |
          set -euo pipefail
          # The module only. Each plugin's test_runtime_env.py stays with its
          # own suite's conventions (the claude-code conftest swaps HOME the
          # Windows-safe way, the cowork one does not), and both cover the same
          # cases — it is the detector itself that must never diverge.
          diff "plugins/claude-code-self-improving-skills/scripts/runtime_env.py" \
               "plugins/claude-cowork-self-improving-skills/scripts/runtime_env.py" \
            || { echo "::error::runtime_env.py differs between the two plugins — copy the fix into both"; exit 1; }
          echo "runtime detector copies are identical"

      # ${CLAUDE_PLUGIN_ROOT} is unexpanded at hook-registration time, so two
      # plugins whose hooks.json carry the same command string register once and
      # one plugin's hooks silently never run. Checked from BOTH workflows: this
      # one fires on claude-code changes, the cowork workflow on cowork changes,
      # so a collision introduced from either side is caught.
      - name: Check hook commands do not collide with the sibling plugin
        shell: python
        run: |
          import json
          from pathlib import Path

          def commands(plugin):
              hooks = json.loads(
                  (Path("plugins") / plugin / "hooks/hooks.json").read_text(encoding="utf-8"))
              return {h["command"]
                      for entries in hooks["hooks"].values()
                      for entry in entries
                      for h in entry["hooks"]}

          mine = commands("claude-code-self-improving-skills")
          sibling = commands("claude-cowork-self-improving-skills")

          root = Path("plugins/claude-code-self-improving-skills")
          for command in sorted(mine):
              name = command.rsplit("/hooks/", 1)[1].rstrip('"')
              if not (root / "hooks" / name).is_file():
                  raise SystemExit(f"hooks.json points at a missing script: {name}")

          shared = mine & sibling
          if shared:
              raise SystemExit(
                  "these hook commands are identical to the cowork plugin's,"
                  " so only one of the two would ever run: " + ", ".join(sorted(shared)))

      - name: Validate JSON manifests and plugin version parity
        shell: python
        run: |
          import json
          from pathlib import Path

          plugin_dir = Path("plugins/claude-code-self-improving-skills")
          manifest = json.loads(
              (plugin_dir / ".claude-plugin/plugin.json").read_text(encoding="utf-8"))
          json.loads((plugin_dir / "hooks/hooks.json").read_text(encoding="utf-8"))

          market = json.loads(
              Path(".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          entries = [p for p in market["plugins"] if p["name"] == manifest["name"]]
          if len(entries) != 1:
              raise SystemExit(
                  f"expected exactly one marketplace entry for {manifest['name']},"
                  f" found {len(entries)}")
          # Bumping only one of the two files is a mistake this repo has made
          # before; the mismatch is invisible until someone installs the plugin.
          if entries[0]["version"] != manifest["version"]:
              raise SystemExit(
                  "version mismatch: marketplace.json says"
                  f" {entries[0]['version']}, plugin.json says {manifest['version']}")
